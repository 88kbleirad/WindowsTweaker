# WindowsTweaker build-only WinUI workflow.
#
# Builds and validates the real WinUI 3 frontend on a Windows GitHub-hosted runner
# without publishing anything: no tags, no GitHub Release, read-only permissions.
# This exists because the XAML markup compiler is a Windows-only process, so C#/XAML
# fixes (e.g. MainWindow.xaml.cs) cannot be verified on Linux; the release job only
# runs when a tag is pushed, which is too late to catch build breaks early.
#
# The build command, payload checks and test paths are identical to the
# frontend-windows job in release.yml, so this workflow exercises the same release
# configuration for the branch selected in the workflow_dispatch UI, then uploads the
# built output as an artifact. Upload happens only after every step above it succeeds,
# and this workflow never creates tags or publishes releases.

name: Build WinUI (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-winui-${{ github.ref }}
  cancel-in-progress: false

jobs:
  winui-build:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Print checked-out commit SHA
        shell: pwsh
        run: |
          $Sha = git rev-parse HEAD
          Write-Host "Checked out commit: $Sha"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build the WinUI frontend (Release, self-contained, unpackaged)
        shell: pwsh
        run: |
          dotnet publish gui/src/WindowsTweaker.WinUI/WindowsTweaker.WinUI.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:AppxPackage=false -p:EnableMsixTooling=false -p:WindowsPackageType=None `
            -p:WindowsAppSDKSelfContained=true `
            -o frontend-build/win-x64
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed with $LASTEXITCODE" }
          # "Compilation succeeded" is not proof the GUI can start: WinUI 3 self-contained
          # apps need the complete Windows App SDK native payload next to the executable
          # (the generated app PRI, the XAML runtime DLLs, engine files, matching
          # architecture). Validate the full asset list before anything is uploaded, and
          # always write the publish inventory so a failure is diagnosable.
          pwsh -NoProfile -File ./tools/Test-WtFrontendPayload.ps1 `
            -Path frontend-build/win-x64 `
            -Inventory frontend-build/publish-inventory.txt
          if ($LASTEXITCODE -ne 0) { throw "frontend payload validation failed" }
          Write-Host "frontend payload for win-x64 verified"

      - name: Upload the publish inventory (diagnostics, even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-publish-inventory
          path: frontend-build/publish-inventory.txt
          if-no-files-found: ignore

      - name: Frontend/core/bridge tests (live backend)
        shell: pwsh
        run: |
          # Host facts first: these are the environment diagnostics that made the 5.1
          # "backend exited before handshake" failure reproducible (PSModulePath order, the
          # module copy each host resolves, bitness, autoload preference).
          $HostDiag = @()
          $HostDiag += "runner: $($PSVersionTable.PSVersion) $($PSVersionTable.PSEdition) bits=$([IntPtr]::Size*8)"
          $HostDiag += "runner PSHOME: $PSHOME"
          $HostDiag += "runner PSModulePath: $env:PSModulePath"
          $HostDiag += "runner PSModuleAutoLoadingPreference: $PSModuleAutoLoadingPreference"
          foreach ($HostExe in @("powershell.exe", "pwsh")) {
            $Probe = Get-Command $HostExe -ErrorAction SilentlyContinue
            if (-not $Probe) { continue }
            $Facts = & $HostExe -NoProfile -Command "`$PSVersionTable.PSVersion.ToString() + '|' + `$PSVersionTable.PSEdition + '|' + [IntPtr]::Size*8 + '|' + `$PSHOME + '|' + `$env:PSModulePath + '|' + `$PSModuleAutoLoadingPreference + '|' + (Get-Command Import-PowerShellDataFile -ErrorAction SilentlyContinue).Source"
            $HostDiag += "$($Probe.Source) -> $Facts"
          }
          $HostDiag | Set-Content -LiteralPath host-diagnostics.txt -Encoding utf8
          Get-Content host-diagnostics.txt

          dotnet test gui/tests/WindowsTweaker.Gui.Core.Tests/WindowsTweaker.Gui.Core.Tests.csproj -c Release --nologo `
            --logger "trx;LogFileName=winui-core.trx"
          if ($LASTEXITCODE -ne 0) { throw "dotnet test failed with $LASTEXITCODE" }

      - name: Upload the host diagnostics and test results (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winui-core-diagnostics
          path: |
            host-diagnostics.txt
            gui/tests/WindowsTweaker.Gui.Core.Tests/TestResults/*.trx
          if-no-files-found: ignore

      - name: Install Pester
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable Pester)) {
            Install-Module Pester -Force -Scope CurrentUser -SkipPublisherCheck -Confirm:$false -ErrorAction Stop
          }

      - name: Bridge protocol contract tests (engine half)
        shell: pwsh
        run: |
          $Result = Invoke-Pester -Path ./tests/BridgeProtocol.Tests.ps1 -Output Detailed -PassThru
          if ($Result.FailedCount -gt 0) { throw "$($Result.FailedCount) test(s) failed." }

      - name: Upload the frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-win-x64-build
          path: frontend-build/win-x64
          if-no-files-found: error
