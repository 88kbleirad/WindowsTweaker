# WindowsTweaker release workflow.
#
# Triggered only by an explicit pushed tag (`v<version>`, and the version must equal the
# module's ModuleVersion) or by a manual dispatch. Packaging is a normal repository tool -
# tools/New-ReleasePackage.ps1 - which builds every worker, writes the archives, the internal
# package manifests, the checksums and the external release manifest, and then validates each
# archive with the bootstrap's own validator. This workflow adds nothing to that contract: it
# runs the tool, runs the tests, and uploads exactly the files the tool produced.
#
# The assets it uploads are the ones the bootstrap resolves by name:
#   WindowsTweaker-<platform>-v<version>.zip   win-x64 | win-arm64 | linux-x64 | linux-arm64
#   checksums.txt
#   manifest.json
#
# Nothing is published if packaging or validation fails: the release step runs only after
# both succeeded, and `gh release create --verify-tag` refuses a tag that does not exist.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the leading v (must equal ModuleVersion in src/WindowsTweaker/WindowsTweaker.psd1)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Builds the actual WinUI 3 frontend on Windows. This is the only place the XAML
  # markup compiler (a Windows process) can run; the output is a real, self-contained,
  # unpackaged build - never a synthetic executable. The x64 build is the one validated
  # against a Windows VM and the one the release archives carry; an ARM64 frontend build
  # is not produced until it can be validated the same way (the ARM64 *archive* still
  # ships - it simply ships without a frontend payload, exactly as a release without any
  # frontend does).
  frontend-windows:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build the WinUI frontend (Release, self-contained, unpackaged)
        shell: pwsh
        run: |
          dotnet publish gui/src/WindowsTweaker.WinUI/WindowsTweaker.WinUI.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:AppxPackage=false -p:EnableMsixTooling=false -p:WindowsPackageType=None `
            -p:WindowsAppSDKSelfContained=true `
            -o frontend-build/win-x64
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed with $LASTEXITCODE" }
          # "Compilation succeeded" is not proof the GUI can start: WinUI 3 self-contained
          # apps need the complete Windows App SDK native payload next to the executable
          # (resources.pri, the XAML runtime DLLs, engine files, matching architecture).
          # Validate the full asset list before anything is uploaded.
          pwsh -NoProfile -File ./tools/Test-WtFrontendPayload.ps1 -Path frontend-build/win-x64
          if ($LASTEXITCODE -ne 0) { throw "frontend payload validation failed" }
          Write-Host "frontend payload for win-x64 verified"

      - name: Frontend bridge tests on Windows (live backend)
        shell: pwsh
        run: |
          dotnet test gui/tests/WindowsTweaker.Gui.Core.Tests/WindowsTweaker.Gui.Core.Tests.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { throw "dotnet test failed with $LASTEXITCODE" }

      - name: Upload the frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-win-x64
          path: frontend-build/win-x64
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: frontend-windows
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve and verify the version
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $ModuleVersion = (Import-PowerShellDataFile ./src/WindowsTweaker/WindowsTweaker.psd1).ModuleVersion
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $Version = $env:INPUT_VERSION
          } else {
            if ($env:REF_NAME -notmatch '^v(?<v>.+)$') { throw "Tag '$($env:REF_NAME)' is not a v<version> tag." }
            $Version = $Matches['v']
          }
          if ($Version -ne $ModuleVersion) {
            throw "Refusing to release '$Version': the module declares ModuleVersion '$ModuleVersion'. Bump the module first, then tag."
          }
          "version=$Version" >> $env:GITHUB_OUTPUT

      - name: Download the Windows frontend builds
        uses: actions/download-artifact@v4
        with:
          name: frontend-win-x64
          path: frontend-artifacts

      - name: Stage the frontend payloads for packaging
        shell: pwsh
        run: |
          # New-ReleasePackage.ps1 takes `frontend/<platform-key>/...` at the repository
          # root and flattens each platform into `frontend/<file>` inside its archive.
          $Src = "frontend-artifacts"
          if (-not (Test-Path $Src)) { throw "Frontend artifact for win-x64 is missing (job did not build it)." }
          $Dest = "frontend/win-x64"
          New-Item -ItemType Directory -Force -Path $Dest | Out-Null
          Copy-Item -Path "$Src/*" -Destination $Dest -Recurse -Force
          # Validate the staged payload (the exact bytes that will enter the archive)
          # before anything is packaged.
          pwsh -NoProfile -File ./tools/Test-WtFrontendPayload.ps1 -Path $Dest
          if ($LASTEXITCODE -ne 0) { throw "staged frontend payload validation failed" }
          Get-ChildItem frontend -Recurse -File | Select-Object -ExpandProperty FullName

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: worker/go.mod
          cache-dependency-path: worker/go.sum

      - name: Install the validation modules
        shell: pwsh
        run: |
          # The gate needs both: PSScriptAnalyzer for phases 4 and 5, Pester for phase 6.
          foreach ($Name in @('Pester', 'PSScriptAnalyzer')) {
            if (-not (Get-Module -ListAvailable $Name)) {
              Install-Module $Name -Force -Scope CurrentUser -SkipPublisherCheck -Confirm:$false -ErrorAction Stop
            }
          }
          # Print what the gate will actually run with. A gate failure on the runner has to be
          # diagnosable from the log alone, and the image ships its own PowerShell and modules.
          'PowerShell      : {0}' -f $PSVersionTable.PSVersion
          foreach ($Name in @('Pester', 'PSScriptAnalyzer')) {
            $Resolved = Get-Module -ListAvailable $Name | Sort-Object Version -Descending | Select-Object -First 1
            '{0,-15} : {1}' -f $Name, $(if ($Resolved) { $Resolved.Version } else { 'missing' })
          }
          'Locale          : LC_ALL={0} LANG={1} culture={2}' -f $env:LC_ALL, $env:LANG, (Get-Culture).Name

      - name: Full validation gate (must pass before anything is packaged)
        shell: pwsh
        run: |
          # The project's own gate: builds the host worker (phase 0 - the SQLite metric tests
          # drive the compiled worker), AST parse, catalog and insight invariants,
          # PSScriptAnalyzer, the Windows PowerShell 5.1 compatibility gate, the whole Pester
          # suite and the dry-run proof. It exits non-zero unless every executed check passed, so
          # a red gate stops the job here and nothing is packaged or published from a tree that
          # failed its own gate.
          pwsh -NoProfile -File ./tools/Invoke-Validation.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "tools/Invoke-Validation.ps1 exited with $LASTEXITCODE. Refusing to package or publish."
          }

      - name: Package and validate (builds all four workers)
        shell: pwsh
        run: |
          ./tools/New-ReleasePackage.ps1 -Version '${{ steps.version.outputs.version }}' -OutDir dist

      - name: Test the bootstrap and the packaging contract
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable Pester)) {
            Install-Module Pester -Force -Scope CurrentUser -SkipPublisherCheck
          }
          $Result = Invoke-Pester -Path ./tests/Bootstrap.Tests.ps1, ./tests/ReleasePackage.Tests.ps1 -Output Detailed -PassThru
          if ($Result.FailedCount -gt 0) { throw "$($Result.FailedCount) test(s) failed." }

      - name: Publish the assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            "dist/WindowsTweaker-win-x64-v$VERSION.zip" \
            "dist/WindowsTweaker-win-arm64-v$VERSION.zip" \
            "dist/WindowsTweaker-linux-x64-v$VERSION.zip" \
            "dist/WindowsTweaker-linux-arm64-v$VERSION.zip" \
            dist/checksums.txt \
            dist/manifest.json \
            --title "WindowsTweaker v$VERSION" \
            --generate-notes \
            --verify-tag
