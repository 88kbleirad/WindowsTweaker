# WindowsTweaker release workflow.
#
# Triggered only by an explicit pushed tag (`v<version>`, and the version must equal the
# module's ModuleVersion) or by a manual dispatch. Packaging is a normal repository tool -
# tools/New-ReleasePackage.ps1 - which builds every worker, writes the archives, the internal
# package manifests, the checksums and the external release manifest, and then validates each
# archive with the bootstrap's own validator. This workflow adds nothing to that contract: it
# runs the tool, runs the tests, and uploads exactly the files the tool produced.
#
# The assets it uploads are the ones the bootstrap resolves by name:
#   WindowsTweaker-<platform>-v<version>.zip   win-x64 | win-arm64 | linux-x64 | linux-arm64
#   checksums.txt
#   manifest.json
#
# Nothing is published if packaging or validation fails: the release step runs only after
# both succeeded, and `gh release create --verify-tag` refuses a tag that does not exist.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the leading v (must equal ModuleVersion in src/WindowsTweaker/WindowsTweaker.psd1)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and verify the version
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $ModuleVersion = (Import-PowerShellDataFile ./src/WindowsTweaker/WindowsTweaker.psd1).ModuleVersion
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $Version = $env:INPUT_VERSION
          } else {
            if ($env:REF_NAME -notmatch '^v(?<v>.+)$') { throw "Tag '$($env:REF_NAME)' is not a v<version> tag." }
            $Version = $Matches['v']
          }
          if ($Version -ne $ModuleVersion) {
            throw "Refusing to release '$Version': the module declares ModuleVersion '$ModuleVersion'. Bump the module first, then tag."
          }
          "version=$Version" >> $env:GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: worker/go.mod
          cache-dependency-path: worker/go.sum

      - name: Package and validate (builds all four workers)
        shell: pwsh
        run: |
          ./tools/New-ReleasePackage.ps1 -Version '${{ steps.version.outputs.version }}' -OutDir dist

      - name: Test the bootstrap and the packaging contract
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable Pester)) {
            Install-Module Pester -Force -Scope CurrentUser -SkipPublisherCheck
          }
          $Result = Invoke-Pester -Path ./tests/Bootstrap.Tests.ps1, ./tests/ReleasePackage.Tests.ps1 -Output Detailed -PassThru
          if ($Result.FailedCount -gt 0) { throw "$($Result.FailedCount) test(s) failed." }

      - name: Publish the assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            "dist/WindowsTweaker-win-x64-v$VERSION.zip" \
            "dist/WindowsTweaker-win-arm64-v$VERSION.zip" \
            "dist/WindowsTweaker-linux-x64-v$VERSION.zip" \
            "dist/WindowsTweaker-linux-arm64-v$VERSION.zip" \
            dist/checksums.txt \
            dist/manifest.json \
            --title "WindowsTweaker v$VERSION" \
            --generate-notes \
            --verify-tag
