# WindowsTweaker short-URL hosting configuration (prepared, not deployed).
#
# The route `/win` must serve `bootstrap/bootstrap.ps1` as plain PowerShell text:
#   - content type: text/plain; charset=utf-8 (or application/x-powershell);
#   - no HTML wrapper, no auth page, no redirect.
#
# A minimal nginx example follows. Adjust the `root`/`alias` to wherever the repo is
# mounted on the host, then reload nginx. DNS entries must be published by the hosting
# provider (out of scope; never automated from this repository).

server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN;               # placeholder - replace with the real domain
    # ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    # Serve the bootstrap as plain text.
    location = /win {
        alias /srv/windows-tweaker/bootstrap/bootstrap.ps1;
        default_type text/plain;           # no HTML wrapper
        charset utf-8;
        add_header Cache-Control "public, max-age=300";  # 5 minutes; see docs
        add_header X-Content-Type-Options "nosniff";
    }

    # Optional: expose the latest release checksums for review.
    location = /win/checksums.txt {
        alias /srv/windows-tweaker/dist/checksums.txt;
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "public, max-age=60";
    }
}
